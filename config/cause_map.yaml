# =============================================================================
# 결함 형태 → 원인 공정 후보 룩업 테이블
#
# 이것은 모델이 아니다. 순수 룩업이다. 학습 대상으로 삼지 않는다.
# AI는 후보와 근거를 제시할 뿐이고, 확정 판단은 엔지니어가 수행한다.
#
# 왜 '결함 클래스'가 아니라 '형태'를 키로 쓰는가
# ---------------------------------------------------------------------------
# Carinthia-S는 결함 클래스 이름을 공개하지 않는다(docs/data_limits.md L6).
# 라벨은 1~6 숫자뿐이며, 두 데이터셋 설명서 어디에도 particle/scratch 같은
# 결함 용어가 나오지 않는다. 숫자에 이름을 붙이는 것은 근거 없는 라벨 생성이다.
# 그래서 마스크에서 **직접 측정되는 형태**를 키로 삼는다. 형태는 관측 사실이고,
# 형태와 원인 공정의 관계는 문헌으로 뒷받침할 수 있다.
#
# 이 표의 적용 한계 (반드시 화면에 함께 노출한다)
# ---------------------------------------------------------------------------
# 1. Carinthia-S가 어느 공정 단계의 층인지 공개되지 않았다. 따라서 아래 후보는
#    "이 형태의 결함이 일반적으로 어느 공정에서 비롯되는가"이지,
#    "이 이미지의 원인이 무엇인가"가 아니다.
# 2. 결함 형태 하나로 원인 공정이 확정되는 경우는 없다. 공정 이력, 발생 시점,
#    웨이퍼 내 분포, 재료 분석(EDX 등)이 함께 있어야 한다.
# 3. 아래 목록은 배타적이지 않다. 여러 후보가 동시에 성립할 수 있다.
# =============================================================================

meta:
  version: 1
  created: 2026-08-21
  key: morphology            # 결함 클래스 이름이 아니라 형태를 키로 쓴다
  is_model: false            # 룩업 테이블. 학습 대상이 아니다.
  decision_owner: engineer   # 확정 판단 주체
  disclaimer: >-
    제시된 항목은 후보이며 확정 판단이 아닙니다. 최종 판단은 엔지니어가 수행합니다.

# ---------------------------------------------------------------------------
# 형태 유형 정의 — 임계값은 Carinthia-S 정답 마스크 4,365장의 실측 분포에서 정했다
# (docs/results.md 표 B-3a·B-3b). 임의로 고른 값이 아니다.
# ---------------------------------------------------------------------------
morphology_rules:
  measure: elongation        # 최대 연결성분의 주축/부축 비 (2차 모멘트 고유값 비의 제곱근)
  rationale: >-
    실측 분포에서 두 군집 사이가 비어 있다. 등방성 군집(라벨 3/4/5)의 elongation
    95분위가 2.50인 반면 선상 군집(라벨 1/2)의 5분위는 3.13이다. 임계값 3은
    그 빈 구간에 놓인다. 선상 군집 내부에서도 라벨 1의 95분위(22.86)와
    라벨 2의 5분위(44.96) 사이가 비어 있어 30을 두 번째 경계로 둔다.
  thresholds:
    none: "area_px == 0"
    compact: "elongation < 3"
    linear_broad: "3 <= elongation < 30"
    linear_fine: "elongation >= 30"

# ---------------------------------------------------------------------------
# 형태별 원인 공정 후보
# 각 항목은 근거(rationale)와 출처(reference)를 반드시 갖는다. 근거 없는 항목은 넣지 않는다.
# ---------------------------------------------------------------------------
morphologies:

  linear_fine:
    description: 가늘고 긴 선상 결함. 폭에 비해 길이가 30배 이상.
    observed_in_dataset:
      labels: [2]
      note: 라벨 2의 8장 전부가 여기 해당한다(elongation 중앙값 51.2, 원형도 0.059).
    candidates:
      - process: CMP
        sub: 슬러리 응집 입자에 의한 긁힘
        rationale: >-
          슬러리는 전단력·온도·경시 변화로 응집체를 만든다. 응집 입자가 패드와
          웨이퍼 사이에 갇히면 연마 방향을 따라 가늘고 긴 긁힘을 남긴다.
        reference:
          - "T. Kwon, M. Ramachandran, J.-G. Park, 'Scratch formation and its mechanism in chemical mechanical planarization (CMP)', Friction, vol. 1, no. 4, pp. 279-305, 2013. doi:10.1007/s40544-013-0026-y"
          - "T. Kwon, B. Cho, M. Ramachandran et al., 'Investigation of Source-Based Scratch Formation During Oxide Chemical Mechanical Planarization', Tribology Letters, vol. 50, no. 2, pp. 169-175, 2013. doi:10.1007/s11249-012-0098-2"
        confidence_note: 후보일 뿐 확정 아님. 긁힘 방향과 연마 방향의 일치 여부를 별도로 확인해야 한다.
      - process: CMP
        sub: 다이아몬드 컨디셔너 이탈 입자
        rationale: >-
          패드 컨디셔닝에 쓰이는 다이아몬드 디스크에서 이탈한 입자가 긁힘의
          원인이 될 수 있다는 것이 실험적으로 보고되었다.
        reference:
          - "T. Kwon, M. Ramachandran, B. Cho et al., 'The impact of diamond conditioners on scratch formation during chemical mechanical planarization', Tribology International, vol. 67, pp. 272-277, 2013. doi:10.1016/j.triboint.2013.08.008"
        confidence_note: 후보일 뿐 확정 아님. 컨디셔너 교체 이력과 대조가 필요하다.
      - process: Handling
        sub: 웨이퍼 반송 중 접촉 손상
        rationale: >-
          반송 로봇·척과의 접촉으로 생긴 손상은 접촉 궤적을 따라 선상으로 남는다.
          이면 손상이 전면 결함과 수율 저하로 이어지는 경로도 보고되어 있다.
        reference:
          - "N. Wang, H. Chang, C. Chang et al., 'Backside Wafer Damage Induced Wafer Front Side Defect and Yield Impact', IEEE/SEMI Advanced Semiconductor Manufacturing Conference (ASMC), pp. 58-60, 2007. doi:10.1109/asmc.2007.375081"
        confidence_note: 후보일 뿐 확정 아님. 웨이퍼 내 위치가 반송 접촉점과 맞는지 확인해야 한다.

  linear_broad:
    description: 굵거나 불규칙한 선상·가지형 결함. 길이/폭 비 3~30.
    observed_in_dataset:
      labels: [1]
      note: >-
        라벨 1의 96.4%(55장 중 53장)가 여기 해당한다(elongation 중앙값 8.85,
        채움률 0.801로 오목한 윤곽, 연결성분 중앙값 2개).
    candidates:
      - process: CMP
        sub: 패드 부스러기·건조 슬러리 덩어리에 의한 긁힘
        rationale: >-
          패드 부스러기나 장비 내부에 말라붙은 슬러리 덩어리가 떨어져 나오면
          단일 입자보다 큰 접촉 면적을 만들어 폭이 넓고 불규칙한 긁힘을 남긴다.
        reference:
          - "T. Kwon, M. Ramachandran, J.-G. Park, 'Scratch formation and its mechanism in chemical mechanical planarization (CMP)', Friction, vol. 1, no. 4, pp. 279-305, 2013. doi:10.1007/s40544-013-0026-y"
        confidence_note: 후보일 뿐 확정 아님.
      - process: Handling
        sub: 반송·척킹 접촉 손상
        rationale: >-
          접촉 압력이 높거나 이물이 개재된 상태로 접촉하면 긁힘의 폭이 넓어진다.
        reference:
          - "N. Wang, H. Chang, C. Chang et al., 'Backside Wafer Damage Induced Wafer Front Side Defect and Yield Impact', IEEE/SEMI ASMC, pp. 58-60, 2007. doi:10.1109/asmc.2007.375081"
          - "'Testing particle generation by a wafer handling robot', Microelectronics Reliability, vol. 26, no. 4, p. 791, 1986. doi:10.1016/0026-2714(86)90131-9"
        confidence_note: 후보일 뿐 확정 아님.
      - process: Edge/Bevel
        sub: 웨이퍼 가장자리 결손에서 파생된 손상
        rationale: >-
          베벨부 결손·치핑은 입자를 생성하고 가장자리 수율에 영향을 준다.
          결함이 웨이퍼 가장자리 쪽에 치우쳐 있을 때 고려할 후보다.
        reference:
          - "S. Ma, B. Ng, T. Min Hou et al., 'Wafer Substrate Bevel Significance to Edge Yield Performance', IEEE/SEMI ASMC, pp. 1-4, 2024. doi:10.1109/asmc61125.2024.10545472"
        confidence_note: >-
          후보일 뿐 확정 아님. Carinthia-S 이미지에는 웨이퍼 내 좌표 정보가 없어
          가장자리 여부를 확인할 수 없다. 실제 라인에서는 좌표로 즉시 판별 가능하다.

  compact:
    description: 등방성 집중 결함. 길이/폭 비 3 미만, 윤곽이 대체로 볼록.
    observed_in_dataset:
      labels: [3, 4, 5]
      note: >-
        라벨 3(4,008장) 97.8%, 라벨 4(289장) 99.7%, 라벨 5(4장) 100%가 여기 해당한다.
        세 라벨은 형태로 구분되지 않고 면적만 다르다(결함 면적 중앙값 각각
        1.67% / 7.37% / 2.69%). 형태만으로 이 셋을 나눌 수 없다는 것이 관측 결과다.
    candidates:
      - process: CMP + Cleaning
        sub: 연마 후 잔류 슬러리 입자
        rationale: >-
          연마 후 웨이퍼 표면에 남은 슬러리 입자는 세정으로 제거해야 하며,
          세정액 조성과 입자-표면 부착력에 따라 제거율이 달라진다. 제거되지 않은
          입자는 등방성 형태의 표면 이물로 관측된다.
        reference:
          - "L. Zhang, T. Wang, X. Lu et al., 'The effect of citric acid based cleaning solution on particle adhesion and removal during post-CMP cleaning', Microelectronic Engineering, vol. 216, p. 111090, 2019. doi:10.1016/j.mee.2019.111090"
          - "J. Taylor, A. Busnaina, 'Yield enhancement through understanding the particle adhesion and removal mechanisms in CMP', IEEE/SEMI Advanced Semiconductor Manufacturing Conference (ASMC), pp. 14-17, 2000. doi:10.1109/asmc.2000.902552"
        confidence_note: 후보일 뿐 확정 아님. 입자 조성 분석(EDX 등)으로 슬러리 유래 여부를 확인해야 한다.
      - process: Etch
        sub: 플라즈마 식각 챔버 내 입자
        rationale: >-
          플라즈마 식각 장비 내부에서 형성된 입자 구름이 웨이퍼 표면을 오염시키는
          경로가 실험적으로 확인되었다. 챔버 코팅 상태에 따라 입자 발생량이 달라진다.
        reference:
          - "S. Collins, J. O'Hanlon, R. Carlile, 'Effects of particle clouds in a plasma etch system on silicon dioxide wafer contamination', Journal of Vacuum Science & Technology A, vol. 12, no. 4, pp. 1397-1402, 1994. doi:10.1116/1.579327"
          - "B. Ma, W. Liu, F. Niu et al., 'Wafer Backside Particle Reduction By Optimizing AC3 Coating for Poly Etch Chamber', ECS Transactions, vol. 34, no. 1, pp. 439-443, 2011. doi:10.1149/1.3567618"
        confidence_note: 후보일 뿐 확정 아님. 챔버 PM 이력, 파티클 모니터 추이와 대조해야 한다.
      - process: 공통(오염 일반)
        sub: 공정 간 입자 오염
        rationale: >-
          입자 결함은 특정 공정에 국한되지 않고 장비·반송·환경 전반에서 발생하며,
          전수 웨이퍼 입자 결함 특성 분석이 원인 추적의 출발점으로 쓰인다.
        reference:
          - "C. R. Brundle, 'Full wafer particle defect characterization', AIP Conference Proceedings, vol. 550, pp. 285-291, 2001. doi:10.1063/1.1354412"
        confidence_note: >-
          가장 넓은 후보다. 이 항목만으로는 조치를 정할 수 없다. 발생 시점·장비별
          분포로 범위를 좁히는 것이 전제다.

  none:
    description: 결함 픽셀이 검출되지 않음.
    observed_in_dataset:
      labels: [6]
      note: >-
        라벨 6의 227장 중 226장이 빈 마스크다. 데이터셋 설명서에 따르면 SEM 장비
        정렬 오차로 결함이 아닌 인접 영역을 촬영한 경우다. 결함 클래스가 아니다.
    candidates:
      - process: Metrology/Inspection
        sub: SEM 정렬 오차로 인한 오촬영
        rationale: >-
          데이터셋 설명서에 명시된 사실이다. 결함 검출 결과가 아니라 취득 실패이므로
          원인 공정 추적 대상이 아니며, 검사 장비 정렬 점검 대상이다.
        reference:
          - "Carinthia-S dataset description (Zenodo doi:10.5281/zenodo.16895427), 'Image examples of all defect classes' 절"
        confidence_note: >-
          데이터셋 제작자가 기술한 사실이다. 다만 예외 1장(8b782473…)은 50픽셀의
          마스크를 가져 서술과 어긋난다. 장수가 1이라 원인을 규명할 수 없다.
