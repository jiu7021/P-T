# =============================================================================
# Fail Address 불량 모드 정의와 판별 규칙
#
# 이것은 모델이 아니다. 규칙 기반 판별기다. 학습하지 않는다.
#
# 데이터 출처에 관한 경고
# ---------------------------------------------------------------------------
# 셀 단위 Fail Address 비트맵은 **공개 데이터가 존재하지 않는다**
# (docs/data_limits.md L3). WM-811K는 다이 단위 합불만 제공하며 칩 내부 셀
# 주소는 없다. 따라서 여기의 주소 데이터는 **전부 합성**이다.
# 합성 규칙은 물리적으로 타당한 형태를 재현하는 것이 목적이며, 절대값이 실제
# 제품과 같다고 주장하지 않는다.
# =============================================================================

meta:
  version: 1
  created: 2026-08-22
  is_model: false
  data_origin: synthetic          # 주소 데이터는 합성. 실데이터가 아니다.

# ---------------------------------------------------------------------------
# 주소 공간
# ---------------------------------------------------------------------------
address_space:
  x_bits: 16                      # X 주소 0x0000 ~ 0xFFFF
  y_bits: 12                      # Y 주소 0x000 ~ 0xFFF
  x_name: "X (row address)"
  y_name: "Y (column address)"
  basis: |
    (가정치) 공개 자료에 실제 제품의 주소 폭이 없다. SK하이닉스 공개 영상
    'N잡러 EP.4 양산기술(P&T)'의 Fail Address 화면에서 X가 4자리 16진수(1a3d),
    Y가 1~3자리 16진수(0 ~ 2e1)로 표기된 것을 근거로 자리수만 맞췄다.
    비트 폭의 절대값은 결론에 영향을 주지 않는다. 판별은 주소의 절대값이 아니라
    같은 주소를 공유하는 fail의 개수와 분포로 이루어지기 때문이다.
  note: 표기는 16진수다. 12진수가 아니다(a~f가 나타난다).

# ---------------------------------------------------------------------------
# 불량 모드
# ---------------------------------------------------------------------------
# 인용 원칙
#   아래 문헌은 서지(저자·저널·권·호·페이지·DOI)를 Crossref로 대조해 확인했다.
#   다만 본문을 직접 읽고 검증하지 않았으므로, **제목에서 확실히 알 수 있는 범위**까지만
#   근거로 쓴다. 예: "Pulsing Test for Defect of Resistive Word Line in DRAM Main Cell"은
#   "워드라인에 저항성 결함이 실재하고 이를 검출하는 시험법이 연구된다"까지가 근거이며,
#   그 논문이 무슨 수치를 냈는지는 주장하지 않는다.
modes:
  single_bit:
    label: 싱글비트
    description: 고립된 단일 셀 fail. 이웃 주소와 관계가 없다.
    plain: |
      셀 하나만 따로 죽은 경우다. 주소를 늘어놓아도 아무 규칙이 안 보인다.
      셀은 커패시터에 전하를 담아 0/1을 기억하는데, 그 커패시터가 새거나
      트랜지스터가 제대로 안 열리면 그 셀 하나만 틀린다.
    process_link: |
      셀 커패시터 형성, 스토리지 노드 콘택, 셀 트랜지스터 공정. 무작위 파티클이
      셀 한 개 크기에 떨어졌을 때도 이렇게 나온다.
    reference:
      - "J.-I. Matsuda et al., 'Measurements of leakage currents and the capacitance of the storage capacitor in a single memory cell', IEEE Transactions on Electron Devices, vol. 41, no. 3, pp. 391-397, 1994. doi:10.1109/16.275225 — 단일 셀 스토리지 커패시터의 누설이 측정 대상이 되는 실재하는 현상임"
      - "J. Won, J. Kim, J. Kim et al., 'Failure Analysis of Bit Line to SNC Leakage Fail in 2x nm DRAM Using Nano-Probing Technique', ISTFA, pp. 202-204, 2014. doi:10.31399/asm.cp.istfa2014p0202 — 비트라인-스토리지노드콘택 간 누설이 셀 단위 fail의 원인으로 분석됨"
  row_fail:
    label: 로우성
    description: 같은 X 주소를 공유하는 fail이 다수. 한 워드라인 방향으로 늘어선다.
    plain: |
      한 줄(행)이 통째로 죽은 경우다. 주소를 보면 X가 하나로 고정된 채 Y만 계속 바뀐다.
      워드라인은 그 행 전체 셀의 문을 여닫는 배선이다. 이 배선이 끊기거나 저항이
      비정상으로 커지면 그 행 전체가 안 열려서 한 줄이 통째로 틀린다.
    process_link: |
      워드라인(게이트) 패터닝과 식각, 워드라인 금속/폴리 배선, 로우 디코더와
      서브워드라인 드라이버 영역. 라인 방향으로 길게 난 결함(긁힘, 라인 브리지)이
      이 형태를 만든다.
    screen_hint: 영상에서 'X = 고정'으로 표시되는 형태가 이것이다.
    reference:
      - "J. Lee, E. Kim, J. Lim et al., 'Pulsing Test for Defect of Resistive Word Line in DRAM Main Cell using WGFMU', ISTFA, pp. 258-262, 2021. doi:10.31399/asm.cp.istfa2021p0258 — 워드라인의 저항성 결함이 실재하며 전용 시험법이 연구됨"
      - "M. Versen, 'DRAM Failure Analysis and Defect Localization Techniques', Microelectronics Failure Analysis (ASM International), pp. 499-505, 2019. doi:10.31399/asm.tb.mfadr7.t91110499 — DRAM 불량 분석과 결함 위치 특정 기법 개괄"
  column_fail:
    label: 칼럼성
    description: 같은 Y 주소를 공유하는 fail이 다수. 비트라인 방향으로 늘어선다.
    plain: |
      한 열(칼럼)이 통째로 죽은 경우다. 주소를 보면 Y가 고정된 채 X만 바뀐다.
      비트라인은 셀에 저장된 값을 읽어 나르는 배선이고, 그 끝에 있는 센스앰프가
      미약한 신호를 증폭한다. 이 경로가 끊기거나 옆 배선과 붙으면 그 열 전체가 틀린다.
    process_link: |
      비트라인 배선과 콘택, 센스앰프 영역, 칼럼 선택 회로. 배선 간 단락(브리지)이나
      콘택 미개구가 대표적이다.
    reference:
      - "J. Won, J. Kim, J. Kim et al., 'Failure Analysis of Bit Line to SNC Leakage Fail in 2x nm DRAM Using Nano-Probing Technique', ISTFA, pp. 202-204, 2014. doi:10.31399/asm.cp.istfa2014p0202 — 비트라인 관련 누설 불량의 분석 사례"
      - "M. Asakura, T. Oishi, S. Tomishima et al., 'A hierarchical bit-line architecture with flexible redundancy and block compare test', Symposium on VLSI Circuits, pp. 93-94, 1993. doi:10.1109/vlsic.1993.920553 — 비트라인 단위 리던던시(칼럼 리페어)가 설계에 반영되는 구조"
  block_fail:
    label: 블락성
    description: 특정 X·Y 구간에 fail이 밀집. 행/열 어느 한쪽으로만 정렬되지 않는다.
    plain: |
      특정 구역이 뭉텅이로 죽은 경우다. 줄 모양이 아니라 덩어리 모양으로 모여 있다.
      메모리는 여러 개의 '매트'라는 블록으로 나뉘는데, 한 블록에 공급되는 전원이나
      기준 전압이 흔들리면 그 블록 셀들이 함께 틀린다. 큰 이물이 떨어져도 이렇게 된다.
    process_link: |
      블록 단위 전원/기준전압 회로, 국소 공정 산포(식각 깊이, 막 두께 편차),
      대면적 파티클. 웨이퍼 맵에서 Loc/Center 패턴으로 보이는 것과 같은 성격이
      칩 안쪽에서 나타난 것이다.
    reference:
      - "J. Vollrath, U. Lederer, T. Hladschik, 'Compressed Bit Fail Maps for Memory Fail Pattern Classification', Journal of Electronic Testing, vol. 17, no. 3-4, pp. 291-297, 2001. doi:10.1023/a:1012271530348 — fail bit map을 패턴(행/열/군집)으로 분류하는 방법론"
      - "Y. Sakai, J. Sawada, W. Sakamoto et al., 'A wafer scale fail bit analysis system for VLSI memory yield improvement', International Conference on Microelectronic Test Structures, pp. 175-178, 1990. doi:10.1109/icmts.1990.67899 — fail bit 분석을 수율 개선에 쓰는 체계"
  cross_fail:
    label: 크로스(로우+칼럼)
    description: 로우성과 칼럼성이 동시에 나타난다.
    plain: |
      가로줄과 세로줄이 동시에 죽어 십자 모양이 되는 경우다.
      행과 열이 만나는 지점의 회로나, 그 위 상위 제어 블록에 문제가 있을 때 나온다.
      불량 셀을 예비 행·열로 바꿔치기하는 리페어 자원을 가장 많이 잡아먹는다.
    process_link: |
      워드라인과 비트라인이 교차하는 영역, 상위 제어/디코더 블록.
    reference:
      - "J. Vollrath, U. Lederer, T. Hladschik, 'Compressed Bit Fail Maps for Memory Fail Pattern Classification', Journal of Electronic Testing, vol. 17, no. 3-4, pp. 291-297, 2001. doi:10.1023/a:1012271530348 — 행·열 패턴을 함께 다루는 분류 체계"
      - "M. Asakura, T. Oishi, S. Tomishima et al., 'A hierarchical bit-line architecture with flexible redundancy and block compare test', Symposium on VLSI Circuits, pp. 93-94, 1993. doi:10.1109/vlsic.1993.920553 — 행·열 리던던시 자원의 유한성"

# ---------------------------------------------------------------------------
# 판별 규칙 — 임계값은 전부 (가정치)다
#
# 왜 가정치인가: 실제 라인의 판정 기준은 제품·리페어 자원 구성에 종속되며
# 공개되어 있지 않다. 아래 값은 "라인성으로 부를 만한 최소 개수"를 상식 수준에서
# 정한 것이다. 임계값이 결론을 얼마나 바꾸는지는 민감도 분석으로 함께 보고한다.
# ---------------------------------------------------------------------------
rules:
  line_min_count: 4               # (가정치) 같은 X(또는 Y)를 공유하는 fail이 이 수 이상이면 라인성 후보
  line_min_ratio: 0.30            # (가정치) 그 라인의 fail이 전체 fail에서 차지하는 비율 하한
  block_window_x: 16              # (가정치) 블락 판정 창 크기 (X 방향 주소 폭)
  block_window_y: 16              # (가정치) 블락 판정 창 크기 (Y 방향)
  block_min_count: 6              # (가정치) 창 안에 이 수 이상 모이면 블락성 후보
  block_min_ratio: 0.40           # (가정치) 창 안 fail이 전체에서 차지하는 비율 하한
  ambiguous_margin: 0.20          # (가정치) 상위 후보와 차상위 후보의 점수 차가 이 값 미만이면 '경계 사례'로 표시

reporting:
  always_show_evidence: true      # 판별 결과에는 반드시 수치 근거를 함께 낸다
  mark_ambiguous: true            # 경계 사례는 단정하지 않고 표시한다
  disclaimer: >-
    임계값은 가정치입니다. 경계에 놓인 사례는 '경계'로 표시되며 최종 판단은
    엔지니어가 수행합니다.
