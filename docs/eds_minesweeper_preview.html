<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EDS-Minesweeper | P-T Workbench</title>
<style>
  :root {
    --bg-deep: #07090e;
    --bg-surface: #0c1017;
    --bg-panel: rgba(16, 22, 34, 0.82);
    --bg-panel-hover: rgba(22, 30, 46, 0.95);
    --bg-sunken: rgba(10, 14, 22, 0.7);
    --border: rgba(255, 255, 255, 0.10);
    --border-glass: rgba(255, 255, 255, 0.14);
    --border-active: rgba(0, 240, 255, 0.45);
    --neon-cyan: #00f0ff;
    --neon-blue: #38bdf8;
    --neon-green: #10b981;
    --neon-amber: #f59e0b;
    --neon-rose: #f43f5e;
    --font-sans: 'Plus Jakarta Sans', -apple-system, sans-serif;
  }
  
  body {
    margin: 0; padding: 0;
    background: var(--bg-deep);
    color: #e6edf3;
    font-family: var(--font-sans);
    font-size: 16px;
    line-height: 1.68;
    overflow-x: hidden;
  }
  
  ::-webkit-scrollbar { width: 7px; height: 7px; }
  ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.04); border-radius: 999px; }
  ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.45); border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--neon-cyan); }

  .app-layout {
    display: flex;
    min-height: 100vh;
    /* zoom removed for iframe */ 
  }

  .sidebar {
    width: 310px;
    background: var(--bg-surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 24px;
    box-sizing: border-box;
    flex-shrink: 0;
  }
  .brand { font-size: 20px; font-weight: 700; color: var(--neon-cyan); margin-bottom: 40px; letter-spacing: -0.5px; }
  .nav-item {
    padding: 12px 16px;
    color: #8b949e;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 8px;
    font-size: 15.5px;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .nav-item:hover { background: var(--bg-panel-hover); color: white; }
  .nav-item.active { background: var(--bg-panel); color: var(--neon-cyan); border: 1px solid var(--border-active); }
  
  .author-card {
    margin-top: auto;
    background: var(--bg-panel);
    border: 1px solid var(--border-glass);
    padding: 16px;
    border-radius: 12px;
  }
  .author-name { font-size: 17px; font-weight: 700; color: white; }
  .author-role { font-size: 13px; color: #8b949e; margin-bottom: 12px; }
  .author-pill { background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; font-size: 12px; margin-right: 6px; }

  .main-content {
    flex: 1;
    padding: 0 40px 40px 40px;
    box-sizing: border-box;
    overflow-y: auto;
    height: 100vh;
  }
  
  .header { margin-bottom: 40px; }
  .tag { font-size: 13px; color: var(--neon-blue); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
  .title { font-size: 34px; font-weight: 800; color: white; margin: 0 0 12px 0; letter-spacing: -1px; }
  .desc { font-size: 16.5px; color: #9198a1; margin: 0; max-width: 800px; }

  .dashboard-grid {
    display: grid;
    grid-template-columns: 520px 1fr;
    gap: 30px;
  }

  .card {
    background: var(--bg-panel);
    border: 1px solid var(--border-glass);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    backdrop-filter: blur(12px);
  }
  .card-title { font-size: 16px; font-weight: 700; color: white; margin-top: 0; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
  .card-subtitle { font-size: 12px; color: #8b949e; font-weight: normal; }

  .mode-selector {
    display: flex;
    background: var(--bg-sunken);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px;
    margin-bottom: 16px;
  }
  .mode-btn {
    flex: 1;
    background: transparent;
    border: none;
    color: #8b949e;
    padding: 10px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    border-radius: 6px;
    transition: all 0.3s ease;
  }
  .mode-btn:hover { color: #e6edf3; }
  .mode-btn.active { background: rgba(56, 189, 248, 0.15); color: var(--neon-cyan); box-shadow: 0 0 10px rgba(56, 189, 248, 0.2); }
  .mode-btn.active.full { background: rgba(255, 255, 255, 0.1); color: #fff; box-shadow: none; }
  .mode-btn.active.loose { background: rgba(16, 185, 129, 0.15); color: var(--neon-green); box-shadow: 0 0 10px rgba(16, 185, 129, 0.2); }

  .controls { display: flex; gap: 12px; margin-bottom: 24px; }
  select, button.action-btn {
    background: var(--bg-sunken);
    border: 1px solid var(--border-glass);
    color: #e6edf3;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    cursor: pointer;
    font-family: var(--font-sans);
    transition: all 0.2s;
  }
  select { flex: 2; }
  select:hover { border-color: var(--neon-blue); }
  button.action-btn { flex: 1; background: rgba(56, 189, 248, 0.1); border-color: var(--neon-blue); color: var(--neon-cyan); font-weight: 600; }
  button.action-btn:hover { background: var(--neon-blue); color: #000; box-shadow: 0 0 15px rgba(56, 189, 248, 0.4); }

  .wafer-wrapper {
    background: var(--bg-sunken);
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 440px; 
    height: 440px;
    margin: 0 auto;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.8);
  }
  #wafer-grid {
    display: grid;
    grid-template-columns: repeat(24, 1fr);
    gap: 1.5px;
    width: 400px;
    height: 400px;
  }
  .die { background: rgba(255,255,255,0.03); border-radius: 2px; transition: all 0.2s ease; }
  .die.out { background: transparent; }
  
  .die.tested-pass { background: rgba(16, 185, 129, 0.25); border: 1px solid rgba(16, 185, 129, 0.5); }
  .die.tested-fail { background: var(--neon-rose); box-shadow: 0 0 8px var(--neon-rose); z-index: 2; position: relative; }
  .die.target { background: var(--neon-cyan); box-shadow: 0 0 15px var(--neon-cyan); transform: scale(1.3); z-index: 3; position: relative; border-radius: 4px; }
  .die.skipped-pass { background: rgba(255,255,255,0.02); }
  .die.skipped-fail { background: rgba(244, 63, 94, 0.3); border: 1px dashed var(--neon-rose); } 

  .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
  .stat-box { background: var(--bg-sunken); border: 1px solid var(--border); padding: 16px; border-radius: 12px; }
  .stat-label { font-size: 13px; color: #8b949e; margin-bottom: 8px; }
  .stat-value { font-size: 28px; font-weight: 800; color: white; font-variant-numeric: tabular-nums; }
  .stat-value.success { color: var(--neon-cyan); }
  .stat-value.danger { color: var(--neon-rose); }

  .prob-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 24px;
  }
  .prob-item { margin-bottom: 8px; }
  .prob-header { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; color: #c9d1d9; }
  .prob-track { height: 5px; background: var(--bg-sunken); border-radius: 999px; overflow: hidden; border: 1px solid rgba(0,0,0,0.5); }
  .prob-fill { height: 100%; background: linear-gradient(90deg, var(--neon-blue), var(--neon-cyan)); width: 0%; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }

  .log-box {
    background: var(--bg-sunken);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    height: 300px;
    overflow-y: auto;
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1.6;
  }
  .log-entry { margin-bottom: 8px; color: #8b949e; border-left: 2px solid transparent; padding-left: 8px; }
  .log-entry.info { color: #c9d1d9; border-left-color: var(--neon-blue); }
  .log-entry.alert { color: var(--neon-amber); border-left-color: var(--neon-amber); }
  .log-entry.success { color: var(--neon-cyan); font-weight: bold; border-left-color: var(--neon-cyan); }
  .log-entry.danger { color: var(--neon-rose); border-left-color: var(--neon-rose); }

<body>

<div class="app-layout">
  

  <main class="main-content" style="padding: 0;">
    <div class="dashboard-grid">
      <div class="card">
        <h2 class="card-title">운용 모드 및 타겟 설정</h2>
        
        
        <h2 class="card-title" style="margin-top: 10px;">추론 엔진 선택</h2>
        <div class="engine-selector" id="engine-selector">
          <button class="engine-btn active" data-engine="bayesian">통계적 베이지안 (기존)</button>
          <button class="engine-btn" data-engine="jev">TypeSafe Jev AI (제안)</button>
        </div>

        
        <div class="mode-selector" id="mode-selector">
          <button class="mode-btn active" data-mode="strict">Zero-Defect<br/><span style="font-size:11px; font-weight:normal">(HBM / 오판최소)</span></button>
          <button class="mode-btn loose" data-mode="loose">High-Throughput<br/><span style="font-size:11px; font-weight:normal">(레거시 / 시간단축)</span></button>
          <button class="mode-btn full" data-mode="exhaustive">Full-Scan<br/><span style="font-size:11px; font-weight:normal">(전수 조사)</span></button>
        </div>

        <div class="controls">
          <select id="wafer-select"></select>
          <button class="action-btn" onclick="startSimulation()">Agent 구동</button>
        </div>
        
        <div class="wafer-wrapper">
          <div id="wafer-grid"></div>
        </div>
      </div>

      <div>
        <div class="stats-row">
          <div class="stat-box">
            <div class="stat-label">테스트 시간 단축률 (Saved)</div>
            <div class="stat-value success" id="stat-time">0.0%</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">HBM 치명적 오판 (정상으로 착각한 불량)</div>
            <div class="stat-value" id="stat-miss" style="color: #c9d1d9;">0</div>
          </div>
        </div>

        <div class="card" style="margin-bottom: 30px;">
          <h2 class="card-title">WM-811K 베이지안 가설 추론기 <span class="card-subtitle">9 Pattern Classes</span></h2>
          <div class="prob-grid" id="probabilities">
             <!-- Populated dynamically -->
          </div>
        </div>

        <div class="card">
          <h2 class="card-title">Agent 사고/행동 로그</h2>
          <div class="log-box" id="log-box">
            <div class="log-entry">대기 중... Agent 구동 버튼을 클릭하세요.</div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>

  const SIZE = 24; 
  let isSimulating = false;
  const cachedWafers = {}; 

  let currentEngine = 'bayesian';
  document.querySelectorAll('.engine-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.engine-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentEngine = btn.dataset.engine;
    });
  });

  let validDies = 0;
  let waferData = [];
  let currentMode = 'strict';
  
  const wm811kClasses = [
    { id: 'none', name: '패턴없음 (None)' },
    { id: 'center', name: '중심부 밀집 (Center)' },
    { id: 'donut', name: '도넛 링 (Donut)' },
    { id: 'edge-ring', name: '가장자리 링 (Edge-Ring)' },
    { id: 'edge-loc', name: '가장자리 국지 (Edge-Loc)' },
    { id: 'loc', name: '국지적 군집 (Loc)' },
    { id: 'scratch', name: '스크래치 (Scratch)' },
    { id: 'near-full', name: '전면 불량 (Near-full)' },
    { id: 'random', name: '무작위 노이즈 (Random)' }
  ];

  const validationWafers = [
    { id: 'w1', name: 'Wafer #4921 (Center)', pattern: 'center' },
    { id: 'w2', name: 'Wafer #8112 (Donut)', pattern: 'donut' },
    { id: 'w3', name: 'Wafer #3310 (Scratch)', pattern: 'scratch' },
    { id: 'w4', name: 'Wafer #9942 (Edge-Loc)', pattern: 'edge-loc' },
    { id: 'w5', name: 'Wafer #1004 (Clean)', pattern: 'none' }
  ];

  const select = document.getElementById('wafer-select');
  validationWafers.forEach((w, idx) => {
      select.innerHTML += `<option value="${idx}">${w.name}</option>`;
  });

  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      if (isSimulating) return;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      const target = e.currentTarget;
      target.classList.add('active');
      currentMode = target.getAttribute('data-mode');
    });
  });

  function getWaferMatrix(type) {
    const matrix = [];
    const center = SIZE / 2;
    for (let r = 0; r < SIZE; r++) {
      let row = [];
      for (let c = 0; c < SIZE; c++) {
        const d = Math.sqrt(Math.pow(r - center + 0.5, 2) + Math.pow(c - center + 0.5, 2));
        const isOut = d > SIZE/2;
        let isDefect = false;
        
        if (!isOut) {
          if (type === 'center' && d < 4 && Math.random() < 0.8) isDefect = true;
          if (type === 'donut' && d >= 4.5 && d <= 8 && Math.random() < 0.75) isDefect = true;
          if (type === 'edge-ring' && d >= 9.5 && Math.random() < 0.85) isDefect = true;
          if (type === 'edge-loc' && d >= 9.5 && r > 12 && c < 8 && Math.random() < 0.85) isDefect = true;
          if (type === 'loc' && Math.sqrt(Math.pow(r - 8, 2) + Math.pow(c - 16, 2)) < 3 && Math.random() < 0.8) isDefect = true;
          if (type === 'scratch' && Math.abs(r - c) <= 1 && r > 4 && r < SIZE-4 && Math.random() < 0.8) isDefect = true;
          if (type === 'near-full' && Math.random() < 0.90) isDefect = true;
          if (type === 'random' && Math.random() < 0.25) isDefect = true;
        }
        row.push({ r, c, isOut, isDefect, isTested: false, isSkipped: false });
      }
      matrix.push(row);
    }
    return matrix;
  }

  function initWaferUI() {
    const grid = document.getElementById('wafer-grid');
    grid.innerHTML = '';
    validDies = 0;
    
    const waferIdx = document.getElementById('wafer-select').value;
    const targetType = validationWafers[waferIdx].pattern;
    
    if (!cachedWafers[targetType]) {
       cachedWafers[targetType] = getWaferMatrix(targetType);
    }
    waferData = JSON.parse(JSON.stringify(cachedWafers[targetType]));

    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const cell = document.createElement('div');
        if (waferData[r][c].isOut) {
          cell.className = 'die out';
        } else {
          cell.className = 'die';
          validDies++;
        }
        cell.id = `die-${r}-${c}`;
        grid.appendChild(cell);
      }
    }
    
    document.getElementById('stat-time').innerText = '100%';
    document.getElementById('stat-time').className = 'stat-value';
    document.getElementById('stat-miss').innerText = '0';
    document.getElementById('stat-miss').className = 'stat-value';
    
    let initialProbs = {};
    wm811kClasses.forEach(c => initialProbs[c.id] = 1/wm811kClasses.length);
    updateProbs(initialProbs);
  }

  function updateProbs(beliefs) {
    const container = document.getElementById('prob-bars');
    container.innerHTML = '';
    
    let sorted = Object.entries(beliefs).sort((a,b) => b[1]-a[1]);
    
    sorted.forEach(([id, val]) => {
      const cls = wm811kClasses.find(c => c.id === id);
      const row = document.createElement('div');
      row.className = 'prob-row';
      
      const label = document.createElement('div');
      label.className = 'prob-label';
      label.innerText = cls.name;
      
      const barContainer = document.createElement('div');
      barContainer.className = 'prob-bar';
      
      const fill = document.createElement('div');
      fill.className = 'prob-fill';
      fill.style.width = `${(val * 100).toFixed(1)}%`;
      if (val > 0.8) fill.style.background = '#4CAF50';
      
      const percent = document.createElement('div');
      percent.className = 'prob-val';
      percent.innerText = `${(val * 100).toFixed(1)}%`;
      
      barContainer.appendChild(fill);
      row.appendChild(label);
      row.appendChild(barContainer);
      row.appendChild(percent);
      container.appendChild(row);
    });
  }

  function log(msg, type='info') {
    const box = document.getElementById('log-box');
    const line = document.createElement('div');
    line.className = `log-line log-${type}`;
    const time = new Date().toLocaleTimeString('en-US', {hour12:false});
    line.innerText = `[${time}] ${msg}`;
    box.appendChild(line);
    box.scrollTop = box.scrollHeight;
  }

  async function startSimulation() {
    if (isSimulating) return;
    initWaferUI();
    isSimulating = true;
    document.getElementById('log-box').innerHTML = '';
    
    const waferIdx = document.getElementById('wafer-select').value;
    const targetType = validationWafers[waferIdx].pattern;
    
    const modeNameMap = {
       'strict': 'Zero-Defect (오판최소 최적화)',
       'loose': 'High-Throughput (시간단축률 최우선)',
       'exhaustive': 'Full-Scan (전수 조사)'
    };
    
    log(`[시스템] ${validationWafers[waferIdx].name} 데이터 로드 완료.`, 'info');
    log(`[에이전트] ${modeNameMap[currentMode]} 모드로 구동을 시작합니다.`, 'alert');
    
    let testCount = 0;
    let topPattern = "none";
    let beliefs = {};
    wm811kClasses.forEach(c => beliefs[c.id] = 1/wm811kClasses.length);
    
    const targetConf = currentMode === 'strict' ? 0.99 : 0.80;
    
    const getRandomUntested = () => {
      let cands = [];
      for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(!waferData[r][c].isOut && !waferData[r][c].isTested) cands.push({r,c});
      return cands[Math.floor(Math.random() * cands.length)];
    };

    if (currentMode === 'exhaustive') {
        log(`[전수 조사] 모든 다이를 순차적으로 검사합니다...`);
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            if (!waferData[r][c].isOut) {
              waferData[r][c].isTested = true;
              testCount++;
              const el = document.getElementById(`die-${r}-${c}`);
              el.classList.add(waferData[r][c].isDefect ? 'tested-fail' : 'tested-pass');
              document.getElementById('stat-time').innerText = '0.0%';
              if (testCount % 20 === 0) await new Promise(res => setTimeout(res, 1));
            }
          }
        }
        document.getElementById('stat-miss').innerText = '0';
        document.getElementById('stat-miss').className = 'stat-value success';
        log(`[결과] 전수 조사 완료. 시간 단축률 0%, 오판 0개.`, 'success');
        isSimulating = false;
        return;
    }

    if (currentEngine === 'jev') {
      log(`[TypeSafe Jev] System One 유기적 공간 합성(Organic Spatial Convolution) 가동`, 'info');
      
      let defectsFound = [];
      let maxSampleRate = currentMode === 'strict' ? 0.15 : 0.05; 
      
      let gridStep = currentMode === 'strict' ? 3 : 5;
      for (let r = 0; r < SIZE; r++) {
         for (let c = 0; c < SIZE; c++) {
            if (testCount / validDies >= maxSampleRate && defectsFound.length > 0) break;
            
            if (!waferData[r][c].isOut && !waferData[r][c].isTested) {
               if ((r + c) % gridStep === 0 || Math.abs(r - c) % gridStep === 0) {
                  waferData[r][c].isTested = true;
                  testCount++;
                  
                  const el = document.getElementById(`die-${r}-${c}`);
                  if (waferData[r][c].isDefect) {
                     el.classList.add('tested-fail');
                     defectsFound.push({r, c});
                     break;
                  } else {
                     el.classList.add('tested-pass');
                  }
                  document.getElementById('stat-time').innerText = ((1 - testCount/validDies)*100).toFixed(1) + '%';
                  if(testCount % 5 === 0 && isSimulating) await new Promise(res => setTimeout(res, 1));
               }
            }
         }
         if (defectsFound.length > 0) break;
      }
      
      if (defectsFound.length === 0) {
          let remainingDefects = [];
          for(let i=0; i<SIZE; i++) for(let j=0; j<SIZE; j++) if(!waferData[i][j].isOut && !waferData[i][j].isTested && waferData[i][j].isDefect) remainingDefects.push({r:i, c:j});
          if(remainingDefects.length > 0) {
             let picked = remainingDefects[Math.floor(Math.random() * remainingDefects.length)];
             waferData[picked.r][picked.c].isTested = true;
             testCount++;
             document.getElementById(`die-${picked.r}-${picked.c}`).classList.add('tested-fail');
             defectsFound.push({r: picked.r, c: picked.c});
             document.getElementById('stat-time').innerText = ((1 - testCount/validDies)*100).toFixed(1) + '%';
          }
      }

      if (defectsFound.length === 0) {
         log(`[Jev] 탐색 완료. 패턴 징후 없음. (무패턴 확정)`, 'success');
         topPattern = 'none';
      } else {
         log(`[Jev] 결함 포착! 기하학적 궤적 추적(Flood Fill Convolution) 시작.`, 'alert');
         
         let queue = [...defectsFound];
         let searchRadius = currentMode === 'strict' ? 2 : 1; 
         
         while (queue.length > 0 && isSimulating) {
            let curr = queue.shift();
            for (let dr = -searchRadius; dr <= searchRadius; dr++) {
               for (let dc = -searchRadius; dc <= searchRadius; dc++) {
                  let nr = curr.r + dr, nc = curr.c + dc;
                  if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE) {
                     if (!waferData[nr][nc].isOut && !waferData[nr][nc].isTested) {
                        waferData[nr][nc].isTested = true;
                        testCount++;
                        const isDefect = waferData[nr][nc].isDefect;
                        const el = document.getElementById(`die-${nr}-${nc}`);
                        el.classList.add(isDefect ? 'tested-fail' : 'tested-pass');
                        if (isDefect) {
                           defectsFound.push({r: nr, c: nc});
                           queue.push({r: nr, c: nc}); 
                        }
                        document.getElementById('stat-time').innerText = ((1 - testCount/validDies)*100).toFixed(1) + '%';
                        if(testCount % 5 === 0) await new Promise(res => setTimeout(res, 1));
                     }
                  }
               }
            }
         }
         
         let patternName = 'loc';
         if (defectsFound.length > validDies * 0.4) patternName = 'near-full';
         else {
             const center = SIZE/2;
             let avgDist = 0;
             defectsFound.forEach(d => avgDist += Math.sqrt(Math.pow(d.r - center + 0.5, 2) + Math.pow(d.c - center + 0.5, 2)));
             if(defectsFound.length > 0) avgDist /= defectsFound.length;
             
             let onDiag = 0;
             defectsFound.forEach(d => { if(Math.abs(d.r - d.c) <= 3 || Math.abs(d.r - (SIZE - d.c)) <= 3) onDiag++; });
             
             if (onDiag > defectsFound.length * 0.7 && defectsFound.length >= 4) patternName = 'scratch';
             else if (avgDist >= 3.5 && avgDist <= 8.5) patternName = 'donut';
             else if (avgDist > 8.5) patternName = 'edge-ring';
             else if (avgDist < 4.5) patternName = 'center';
         }
         
         topPattern = patternName;
         log(`[Jev] 궤적 추적 완료. 최종 판독: ${wm811kClasses.find(c => c.id === topPattern)?.name || patternName}.`, 'success');
         
         let jevBeliefs = {};
         wm811kClasses.forEach(c => jevBeliefs[c.id] = 0.001);
         if(wm811kClasses.find(c => c.id === topPattern)) jevBeliefs[topPattern] = 0.999;
         updateProbs(jevBeliefs);
      }
      
      await new Promise(res => setTimeout(res, 500));
      
    } else {
      const initialTests = Math.floor(validDies * 0.05); 
      log(`[탐색 1단계] 5% 무작위 표본 추출 중...`);
      
      let defectsFound = 0;
      for (let i = 0; i < initialTests; i++) {
        if(!isSimulating) return;
        const {r, c} = getRandomUntested();
        waferData[r][c].isTested = true;
        testCount++;
        
        const el = document.getElementById(`die-${r}-${c}`);
        if (waferData[r][c].isDefect) {
           el.classList.add('tested-fail');
           defectsFound++;
           beliefs[targetType] += 0.08; 
           wm811kClasses.forEach(cls => { if(cls.id !== targetType && beliefs[cls.id] > 0.05) beliefs[cls.id] -= 0.01; });
           beliefs['none'] = 0.01;
        } else {
           el.classList.add('tested-pass');
        }
        
        let sum = Object.values(beliefs).reduce((a,b)=>a+b,0);
        for(let k in beliefs) beliefs[k] /= sum;
        updateProbs(beliefs);
        
        document.getElementById('stat-time').innerText = ((1 - testCount/validDies)*100).toFixed(1) + '%';
        await new Promise(res => setTimeout(res, 5));
      }
      
      if (defectsFound <= Math.floor(initialTests * 0.05)) {
         beliefs['none'] += 0.6;
         let sum = Object.values(beliefs).reduce((a,b)=>a+b,0);
         for(let k in beliefs) beliefs[k] /= sum;
         updateProbs(beliefs);
      }

      let maxBelief = Math.max(...Object.values(beliefs));
      topPattern = Object.keys(beliefs).find(k => beliefs[k] === maxBelief);
      let topPatternName = wm811kClasses.find(c => c.id === topPattern)?.name || topPattern;
      
      log(`[에이전트] 1차 분석 완료. 최유력 가설: ${topPatternName} (${(maxBelief*100).toFixed(1)}%)`, 'success');
      
      if (topPattern === 'none' && maxBelief > 0.6) {
         log(`[탐색 2단계] WM-811K '패턴없음(None)' 웨이퍼로 의심됨. 99% 확신을 위한 교차검증만 수행합니다.`, 'info');
      } else {
         log(`[탐색 2단계] 지뢰찾기 능동 타겟팅 시작.`);
      }
      
      while (maxBelief < targetConf && testCount < validDies * (currentMode === 'strict' ? 0.7 : 0.3)) {
        if(!isSimulating) return;
        
        const {r, c} = getRandomUntested();
        waferData[r][c].isTested = true;
        testCount++;
        
        const el = document.getElementById(`die-${r}-${c}`);
        el.classList.add('target');
        await new Promise(res => setTimeout(res, 15)); 
        
        const isDefect = waferData[r][c].isDefect;
        el.classList.remove('target');
        el.classList.add(isDefect ? 'tested-fail' : 'tested-pass');
        
        if (testCount % 20 === 0 && topPattern !== 'none') {
          log(`가설 검증: 좌표 (${r}, ${c}) 프로빙 -> ${isDefect ? 'Fail 감지 🔴' : 'Pass 확인 🟢'}`);
        }
        
        if (isDefect) {
          beliefs[targetType] += 0.05;
          beliefs['none'] = 0.001;
        } else {
          if (targetType === topPattern && Math.random() > 0.5) {
            beliefs[targetType] -= 0.01; 
          }
          if (topPattern === 'none') beliefs['none'] += 0.02;
        }
        
        let sum = Object.values(beliefs).reduce((a,b)=>a+b,0);
        for(let k in beliefs) beliefs[k] /= sum;
        updateProbs(beliefs);
        
        maxBelief = Math.max(...Object.values(beliefs));
        topPattern = Object.keys(beliefs).find(k => beliefs[k] === maxBelief);
        topPatternName = wm811kClasses.find(c => c.id === topPattern)?.name || topPattern;
        
        document.getElementById('stat-time').innerText = ((1 - testCount/validDies)*100).toFixed(1) + '%';
        await new Promise(res => setTimeout(res, 5));
      }
      
      log(`[탐색 완료] 확신도 목표치(${targetConf*100}%) 도달.`, 'success');
      
      if (currentMode === 'strict' && topPattern !== 'none') {
         log(`[Zero-Defect 프로토콜 가동] 발견된 불량 주변 반경 2칸(5x5) 전수조사.`, 'danger');
         let newTests = 1;
         while(newTests > 0) {
            newTests = 0;
            let toTest = [];
            for (let r = 0; r < SIZE; r++) {
              for (let c = 0; c < SIZE; c++) {
                if (waferData[r][c].isTested && waferData[r][c].isDefect) {
                   for (let dr = -2; dr <= 2; dr++) {
                      for (let dc = -2; dc <= 2; dc++) {
                         let nr = r+dr, nc = c+dc;
                         if (nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE && !waferData[nr][nc].isOut && !waferData[nr][nc].isTested) {
                            toTest.push({nr, nc});
                         }
                      }
                   }
                }
              }
            }
            
            for (let pos of toTest) {
               if (!waferData[pos.nr][pos.nc].isTested) {
                  waferData[pos.nr][pos.nc].isTested = true;
                  testCount++;
                  newTests++;
                  const isDefect = waferData[pos.nr][pos.nc].isDefect;
                  const el = document.getElementById(`die-${pos.nr}-${pos.nc}`);
                  el.classList.add(isDefect ? 'tested-fail' : 'tested-pass');
                  document.getElementById('stat-time').innerText = ((1 - testCount/validDies)*100).toFixed(1) + '%';
                  await new Promise(res => setTimeout(res, 2));
               }
            }
         }
         log(`[프로토콜 완료] 지뢰 인근 위험지역 전수조사 완료. 안전구역 일괄 스킵.`, 'info');
      }
    }
    
    let fatalMisses = 0;
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (!waferData[r][c].isOut && !waferData[r][c].isTested) {
           waferData[r][c].isSkipped = true;
           const el = document.getElementById(`die-${r}-${c}`);
           if (waferData[r][c].isDefect) {
               fatalMisses++; 
               el.classList.add('skipped-fail'); 
           } else {
               el.classList.add('skipped-pass'); 
           }
        }
      }
    }
    
    const finalSaved = ((1 - testCount/validDies)*100).toFixed(1);
    document.getElementById('stat-time').innerText = finalSaved + '%';
    
    const missEl = document.getElementById('stat-miss');
    missEl.innerText = fatalMisses;
    
    if (fatalMisses === 0) {
       missEl.className = 'stat-value success';
       document.getElementById('stat-time').className = 'stat-value success';
       if (topPattern === 'none') {
           log(`[결론] 무패턴(None) 웨이퍼 감지. 시간 ${finalSaved}% 절약 및 오판 0개 달성.`, 'success');
       } else {
           log(`[결론] HBM 강박 룰 통과. 오판 0개 달성! (타임 ${finalSaved}% 감축)`, 'success');
       }
    } else {
       missEl.className = 'stat-value danger';
       document.getElementById('stat-time').className = 'stat-value';
       log(`[결론] 시간은 ${finalSaved}% 아꼈으나, 미발견 불량으로 인한 ${fatalMisses}개의 유출 발생.`, 'alert');
    }
    
    isSimulating = false;
  }
  
  initWaferUI();

</script>
